<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="popover.css" />
    <link rel="stylesheet" href="controls.css" />
  </head>
  <body>
    <img id="background" alt="" hidden />

    <div id="idle" hidden>Play something on Spotify</div>

    <main id="player" hidden>
      <div class="artwork" title="Double-click to open Spotify">
        <img id="artwork" alt="" hidden />
        <div class="controls">
          <button data-command="previous" aria-label="Previous">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 5h2.5v14H6zM20 5.5v13a1 1 0 0 1-1.5.86L9.5 13.2a1.4 1.4 0 0 1 0-2.4l9-6.16A1 1 0 0 1 20 5.5z" /></svg>
          </button>
          <button data-command="playpause" class="play" aria-label="Play/Pause">
            <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22"><path d="M7 4.6v14.8a1 1 0 0 0 1.53.85l11.5-7.4a1 1 0 0 0 0-1.7L8.53 3.75A1 1 0 0 0 7 4.6z" /></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" hidden><rect x="5.5" y="4" width="4.5" height="16" rx="1.2" /><rect x="14" y="4" width="4.5" height="16" rx="1.2" /></svg>
          </button>
          <button data-command="next" aria-label="Next">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M18 5h-2.5v14H18zM4 5.5v13a1 1 0 0 0 1.5.86l9-6.16a1.4 1.4 0 0 0 0-2.4l-9-6.16A1 1 0 0 0 4 5.5z" /></svg>
          </button>
        </div>
      </div>

      <div class="details">
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
        <div id="time" class="time"></div>
      </div>
    </main>

    <script src="player-common.js"></script>
    <script src="popover.js"></script>
  </body>
</html>
