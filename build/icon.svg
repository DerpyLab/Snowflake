<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Snowflake app icon: macOS squircle (824pt body on a 1024 canvas), snowflake with a play button at its core -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8ee7ff" />
      <stop offset="0.48" stop-color="#6a5cff" />
      <stop offset="1" stop-color="#d63fe6" />
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <filter id="flake-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a0a5e" flood-opacity="0.35" />
    </filter>
    <g id="arm" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M512 392 V182" />
      <path d="M512 257 L460 205 M512 257 L564 205" />
      <path d="M512 322 L478 288 M512 322 L546 288" />
    </g>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)" />
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" />
  </g>

  <g filter="url(#flake-shadow)">
    <use xlink:href="#arm" />
    <use xlink:href="#arm" transform="rotate(60 512 512)" />
    <use xlink:href="#arm" transform="rotate(120 512 512)" />
    <use xlink:href="#arm" transform="rotate(180 512 512)" />
    <use xlink:href="#arm" transform="rotate(240 512 512)" />
    <use xlink:href="#arm" transform="rotate(300 512 512)" />
    <!-- Hexagonal core joining the arms, with a play button inside -->
    <path d="M512 392 L615.9 452 L615.9 572 L512 632 L408.1 572 L408.1 452 Z" fill="none" stroke="#ffffff" stroke-width="30" stroke-linejoin="round" />
    <path d="M490 470 L490 554 L562 512 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />
  </g>
</svg>
